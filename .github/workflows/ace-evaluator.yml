name: ACE evaluator CI

on:
  push:
    branches: [ace-independent-evaluator-20260912]
    paths:
      - 'ace-evaluator/**'
      - '.github/workflows/ace-evaluator.yml'
  pull_request:
    paths:
      - 'ace-evaluator/**'
      - '.github/workflows/ace-evaluator.yml'

jobs:
  evaluator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace-evaluator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache-dependency-path: ace-evaluator/go.mod
      - name: Test protocol unit suite
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test cgroup path invariant
        run: bash scripts/test-cgroup-path.sh
      - name: Build sealed evaluator
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ace-evaluator
      - name: Record executable digest
        run: sha256sum ace-evaluator | tee ace-evaluator.sha256
      - name: Upload evaluator artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-evaluator-linux-amd64
          path: |
            ace-evaluator/ace-evaluator
            ace-evaluator/ace-evaluator.sha256
          if-no-files-found: error
