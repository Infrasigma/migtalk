name: ACE scientific sandbox admission

on:
  workflow_dispatch:
    inputs:
      cgroup_path:
        description: 'Absolute cgroup-v2 path containing the runner service'
        required: true
        type: string
      run_adversarial_tests:
        description: 'Run production-path adversarial tests'
        required: true
        default: true
        type: boolean

jobs:
  scientific-sandbox-admission:
    # Scientific admission must run only on an explicitly provisioned Linux host
    # with a delegated finite cgroup boundary. A GitHub-hosted runner is not a
    # substitute for the frozen production contract.
    runs-on: [self-hosted, linux, ace-cgroup-v2]
    defaults:
      run:
        working-directory: ace-evaluator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache-dependency-path: ace-evaluator/go.mod

      - name: Verify cgroup-v2 scientific host contract
        env:
          ACE_REQUIRE_CGROUP: '1'
          ACE_CGROUP_V2_PATH: ${{ inputs.cgroup_path }}
        run: |
          set -eu
          test -r /proc/self/cgroup
          test -d /sys/fs/cgroup
          test -r "/sys/fs/cgroup${ACE_CGROUP_V2_PATH}/cpu.max"
          test -r "/sys/fs/cgroup${ACE_CGROUP_V2_PATH}/memory.max"
          test -r "/sys/fs/cgroup${ACE_CGROUP_V2_PATH}/memory.swap.max"
          test -r "/sys/fs/cgroup${ACE_CGROUP_V2_PATH}/pids.max"
          test -w "/sys/fs/cgroup${ACE_CGROUP_V2_PATH}/cgroup.procs"
          test -w "/sys/fs/cgroup${ACE_CGROUP_V2_PATH}/cgroup.subtree_control"
          grep -Fqx "0::${ACE_CGROUP_V2_PATH}" /proc/self/cgroup
          ACE_CGROUP_ROOT=/sys/fs/cgroup bash scripts/check-cgroup-boundary.sh check-runner "$ACE_CGROUP_V2_PATH"
          go test ./... -run 'TestValidateScientificCgroup' -count=1

      - name: Run machine-verifiable kernel admission probe
        env:
          ACE_CGROUP_V2_PATH: ${{ inputs.cgroup_path }}
          ACE_EVIDENCE_DIR: ${{ github.workspace }}/ace-evidence
        run: |
          set -eu
          ./scripts/validate-ace-host.sh "$ACE_CGROUP_V2_PATH"

      - name: Build exact evaluator executable
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/ace-evidence"
          CGO_ENABLED=0 go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/ace-evaluator" .
          sha256sum "$RUNNER_TEMP/ace-evaluator" | tee "$GITHUB_WORKSPACE/ace-evidence/evaluator.sha256"

      - name: Run production-path adversarial sandbox tests in isolated child cgroup
        if: ${{ inputs.run_adversarial_tests }}
        env:
          ACE_RUN_SANDBOX_TESTS: '1'
          ACE_REQUIRE_CGROUP: '1'
          ACE_CGROUP_V2_PATH: ${{ inputs.cgroup_path }}
          ACE_SANDBOX_EXECUTABLE: ${{ runner.temp }}/ace-evaluator
        run: |
          set -eu
          parent="/sys/fs/cgroup${ACE_CGROUP_V2_PATH}"
          child="${parent}/ace-scientific-workload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$child"
          cleanup() { rmdir "$child" 2>/dev/null || true; }
          trap cleanup EXIT

          # The runner service remains in the parent cgroup. Only the destructive
          # evaluator/test process is moved into this delegated child boundary,
          # so an intentional memory/PID/resource exhaustion cannot kill the CI
          # runner and turn the observation into a failure-domain ambiguity.
          printf '%s' '100000 100000' > "$child/cpu.max"
          printf '%s' '1073741824' > "$child/memory.max"
          printf '%s' '0' > "$child/memory.swap.max"
          printf '%s' '256' > "$child/pids.max"

          ACE_CGROUP_ROOT=/sys/fs/cgroup bash scripts/check-cgroup-boundary.sh \
            check-workload "$ACE_CGROUP_V2_PATH" \
            "${ACE_CGROUP_V2_PATH}/ace-scientific-workload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          set +e
          (
            echo "$BASHPID" > "$child/cgroup.procs"
            test "$(awk -F: '$1 == \"0\" {print $3}' /proc/self/cgroup)" = "${ACE_CGROUP_V2_PATH}/ace-scientific-workload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            ACE_CGROUP_ROOT=/sys/fs/cgroup bash scripts/check-cgroup-boundary.sh \
              check-workload "$ACE_CGROUP_V2_PATH" \
              "${ACE_CGROUP_V2_PATH}/ace-scientific-workload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            exec env \
              ACE_RUN_SANDBOX_TESTS="$ACE_RUN_SANDBOX_TESTS" \
              ACE_REQUIRE_CGROUP="$ACE_REQUIRE_CGROUP" \
              ACE_CGROUP_V2_PATH="$ACE_CGROUP_V2_PATH" \
              ACE_SANDBOX_EXECUTABLE="$ACE_SANDBOX_EXECUTABLE" \
              CGO_ENABLED=0 go test ./... -run '^TestSandboxAdversarialFilesystemAndBlindness$' -count=1 -v
          )
          status=$?
          set -e
          echo "isolated_workload_exit_status=${status}"
          test "$status" -eq 0

      - name: Publish physical validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-physical-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ace-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Refuse scientific admission without verified boundary
        run: |
          echo "Scientific admission remains unauthorized unless every required host and production-path test above succeeds."
